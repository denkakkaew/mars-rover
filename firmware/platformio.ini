; Mars Rover — ESP32 rover firmware (plan/storyboard.md 5.2)
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the firmware only. The native env below exists for host tests and
; cannot build src/main.cpp, which needs the Arduino framework.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0   ; pins arduino-esp32 2.0.x (LEDC API used in lib/Drive)
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; src/bringup.cpp is step 1.1's standalone sketch and has its own setup()/loop().
; Excluded here so the real firmware never links two of each.
; src/bringup.cpp and src/wifi_scan.cpp are standalone bench sketches, each with its own
; setup()/loop(). Excluded here so the real firmware never links more than one.
build_src_filter =
	+<*>
	-<bringup.cpp>
	-<wifi_scan.cpp>

build_flags =
	-DCORE_DEBUG_LEVEL=3

lib_deps =
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.2.0
	; Phase 2 (manipulator) and Phase 3 (mast pan/tilt) add:
	; madhephaestus/ESP32Servo@^3.0.5

; Never run `pio test` against this env: it would try to upload a test runner to a
; board. The safety-critical logic is tested on the host instead — see [env:native].
test_ignore = *

; ---------------------------------------------------------------------------------
; Board bring-up — IMPLEMENTATION_PLAN.md step 1.1.
;
; Blink plus serial identity, no Wi-Fi and no secrets.h, so a board can be proven alive
; before anything else is true of it:
;
;   python -m platformio run -e bringup -t upload -t monitor
;
; upload_speed is deliberately 460800 rather than esp32dev's 921600. Step 1.1 says to
; drop from 921600 if uploads are flaky, and the *first* flash onto an unknown board with
; an unknown USB cable is exactly when flakiness is least diagnosable — a failed upload
; at 921600 looks identical to a dead board. Prove the board at a conservative speed
; first, then let esp32dev use the fast one.
; ---------------------------------------------------------------------------------
[env:bringup]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<bringup.cpp>
; 921600 was proven on this board at step 1.1 (2/2 clean, 1014 kbit/s), so the
; conservative rate here is no longer a workaround — it is kept only so that a *first*
; flash onto some future board still fails safely. Raise it if bring-up gets tedious.
upload_speed = 460800
test_ignore = *

; ---------------------------------------------------------------------------------
; Wi-Fi survey — steps 1.2 and 0.5. Scans continuously and needs no credentials, so it
; both tells you the exact SSID to put in secrets.h and serves as the instrument for the
; RSSI-through-glass survey:
;
;   python -m platformio run -e wifiscan -t upload -t monitor
; ---------------------------------------------------------------------------------
[env:wifiscan]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<wifi_scan.cpp>
test_ignore = *

; ---------------------------------------------------------------------------------
; Host unit tests for the safety-critical logic, with no ESP32 attached
; (IMPLEMENTATION_PLAN.md S.4). lib/Protocol and lib/Safety are deliberately free of
; Arduino headers so they can be built and tested right here.
;
;   python -m platformio test -e native
; ---------------------------------------------------------------------------------
[env:native]
platform = native

; src/ is Arduino-only; the tests link against lib/ directly.
build_src_filter = -<*>

build_flags =
	-std=c++17
	-Wall
	-Wextra

lib_deps =
	bblanchon/ArduinoJson@^7.2.0
