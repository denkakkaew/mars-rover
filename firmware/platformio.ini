; Mars Rover — ESP32 rover firmware (plan/storyboard.md 5.2)
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the firmware only. The native env below exists for host tests and
; cannot build src/main.cpp, which needs the Arduino framework.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0   ; pins arduino-esp32 2.0.x (LEDC API used in lib/Drive)
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; src/bringup.cpp is step 1.1's standalone sketch and has its own setup()/loop().
; Excluded here so the real firmware never links two of each.
; src/bringup.cpp and src/wifi_scan.cpp are standalone bench sketches, each with its own
; setup()/loop(). Excluded here so the real firmware never links more than one.
build_src_filter =
	+<*>
	-<bringup.cpp>
	-<wifi_scan.cpp>
	-<motor_test.cpp>
	-<cam_check.cpp>
	-<xiao_cam.cpp>
	-<xiao_stream.cpp>

build_flags =
	-DCORE_DEBUG_LEVEL=3

lib_deps =
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.2.0
	; Phase 2 (manipulator) and Phase 3 (mast pan/tilt) add:
	; madhephaestus/ESP32Servo@^3.0.5

; Never run `pio test` against this env: it would try to upload a test runner to a
; board. The safety-critical logic is tested on the host instead — see [env:native].
test_ignore = *

; ---------------------------------------------------------------------------------
; Board bring-up — IMPLEMENTATION_PLAN.md step 1.1.
;
; Blink plus serial identity, no Wi-Fi and no secrets.h, so a board can be proven alive
; before anything else is true of it:
;
;   python -m platformio run -e bringup -t upload -t monitor
;
; upload_speed is deliberately 460800 rather than esp32dev's 921600. Step 1.1 says to
; drop from 921600 if uploads are flaky, and the *first* flash onto an unknown board with
; an unknown USB cable is exactly when flakiness is least diagnosable — a failed upload
; at 921600 looks identical to a dead board. Prove the board at a conservative speed
; first, then let esp32dev use the fast one.
; ---------------------------------------------------------------------------------
[env:bringup]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<bringup.cpp>
; 921600 was proven on this board at step 1.1 (2/2 clean, 1014 kbit/s), so the
; conservative rate here is no longer a workaround — it is kept only so that a *first*
; flash onto some future board still fails safely. Raise it if bring-up gets tedious.
upload_speed = 460800
test_ignore = *

; ---------------------------------------------------------------------------------
; Wi-Fi survey — steps 1.2 and 0.5. Scans continuously and needs no credentials, so it
; both tells you the exact SSID to put in secrets.h and serves as the instrument for the
; RSSI-through-glass survey:
;
;   python -m platformio run -e wifiscan -t upload -t monitor
; ---------------------------------------------------------------------------------
[env:wifiscan]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<wifi_scan.cpp>
test_ignore = *

; ---------------------------------------------------------------------------------
; Motor bench test — step 1.3. Serial-driven, no Wi-Fi and no console, so a motor that
; will not turn is not diagnosed through a radio link. Drives through lib/Drive, so the
; deadband and the steering threshold under test are the ones the rover will run:
;
;   python -m platformio run -e motortest -t upload -t monitor
; ---------------------------------------------------------------------------------
[env:motortest]
extends = env:esp32dev
build_src_filter =
	-<*>
	+<motor_test.cpp>
test_ignore = *

; ---------------------------------------------------------------------------------
; Camera board bring-up -- step 2.0b.1.
;
; A DIFFERENT PHYSICAL BOARD from every env above: ESP32-CAM, not the
; ESP32-D0WD-V3 devkit. It does not `extend` esp32dev for that reason -- sharing a
; board= with the rover controller is exactly the mistake this separation prevents.
;
;   python -m platformio run -e camcheck -t upload -t monitor
;
; The ESP32-CAM has no USB. Flashing needs a 3.3 V USB-TTL adapter, GPIO0 strapped to
; GND while the board resets, and -- this is the one that wastes afternoons -- a 5 V
; supply that can actually deliver the OV2640's inrush. Powering the module from an
; adapter's 3.3 V pin browns it out, and a brownout during enumeration looks exactly
; like a dead adapter (see step 2.0b.1's notes).
;
; upload_speed follows [env:bringup]'s reasoning: a *first* flash onto an unproven board
; should fail slowly and legibly rather than ambiguously at speed.
; ---------------------------------------------------------------------------------
[env:camcheck]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

build_src_filter =
	-<*>
	+<cam_check.cpp>

; The module normally carries 4 MB of PSRAM and the camera driver needs it for QVGA
; double buffering. Without the flag the frame buffer lands in DRAM, initialises, and
; then starves -- a failure that reads as a flaky sensor. NOTE: some clones ship with no
; PSRAM at all, so cam_check.cpp reports what is actually fitted rather than assuming.
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM

test_ignore = *

; ---------------------------------------------------------------------------------
; XIAO ESP32S3 Sense camera bring-up -- step 2.0b.1x.
;
; A THIRD physical board: Seeed XIAO ESP32S3 Sense, received 2026-09-18, and the one the
; detector will actually ship on. Separate env for the same reason [env:camcheck] is
; separate -- it is different silicon (ESP32-S3, 8 MB OPI PSRAM, native USB) from both the
; rover controller and the ESP32-CAM, and sharing a `board=` between any of them is
; exactly the mistake this separation prevents.
;
;   python -m platformio run -e xiaocam -t upload -t monitor
;
; Unlike the ESP32-CAM this needs no FTDI adapter, no GPIO0 strap and no external 5 V: it
; enumerates as USB CDC over the cable that powers it. If the port does not appear, hold
; BOOT, tap RESET, release BOOT to force the ROM bootloader.
;
; upload_speed is deliberately not set. The board file asks for 460800, and on a native
; USB CDC link the figure is nominal anyway -- there is no real UART to run fast or slow.
;
; PSRAM needs no build flag here: boards/seeed_xiao_esp32s3.json already carries
; -DBOARD_HAS_PSRAM and, critically, board_build.arduino.memory_type = qio_opi. That
; second setting is the one that matters -- this board's PSRAM is OPI, and without it
; psramFound() returns false on perfectly good silicon. Do not "fix" a missing-PSRAM
; report by adding the flag; check the memory type first.
; ---------------------------------------------------------------------------------
[env:xiaocam]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter =
	-<*>
	+<xiao_cam.cpp>

build_flags =
	-DCORE_DEBUG_LEVEL=3

test_ignore = *

; ---------------------------------------------------------------------------------
; XIAO ESP32S3 Sense Wi-Fi camera -- step 2.0b.2. Same board as [env:xiaocam]; this one
; adds the network, so the corpus can be pulled in bulk and the lens aimed from a live
; view:
;
;   python -m platformio run -e xiaostream -t upload -t monitor
;
; NEEDS include/secrets.h, unlike every bring-up env in this file. That is the whole
; difference, and it is why bring-up came first: a board proven at 2.0b.1x means a failure
; here is the network, never the sensor.
;
; The Wi-Fi join is BOUNDED. main.cpp's is not -- that is known defect F7 -- and
; joinWiFi() in xiao_stream.cpp is the shape to copy when step 1.2 fixes it.
; ---------------------------------------------------------------------------------
[env:xiaostream]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter =
	-<*>
	+<xiao_stream.cpp>

build_flags =
	-DCORE_DEBUG_LEVEL=3

test_ignore = *

; ---------------------------------------------------------------------------------
; Host unit tests for the safety-critical logic, with no ESP32 attached
; (IMPLEMENTATION_PLAN.md S.4). lib/Protocol and lib/Safety are deliberately free of
; Arduino headers so they can be built and tested right here.
;
;   python -m platformio test -e native
; ---------------------------------------------------------------------------------
[env:native]
platform = native

; src/ is Arduino-only; the tests link against lib/ directly.
build_src_filter = -<*>

build_flags =
	-std=c++17
	-Wall
	-Wextra

lib_deps =
	bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------------
; XIAO ESP32S3 Sense live rock detection -- step 2.0e. The same board and camera as
; [env:xiaostream], plus the Edge Impulse FOMO model trained at 2.0c/2.0d running on
; the board itself:
;
;   python -m platformio run -e xiaodetect -t upload -t monitor
;
; NEEDS include/secrets.h, like [env:xiaostream].
;
; THE MODEL IS A LIBRARY, AND IT IS GENERATED. lib/EiRockModel is an Edge Impulse C++
; export -- about 1500 files, none of them hand-written. Only its library.json belongs
; to this repo; it exists because the export ships CMake, not a PlatformIO manifest, and
; PlatformIO otherwise compiles neither the nested SDK sources nor the ESP-NN assembly.
; Retraining means replacing the whole folder and keeping that one file.
;
; ESP-NN is what makes this usable. It is the ESP32-S3's vector-instruction kernel
; library, enabled by EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN in that manifest. Edge Impulse
; Studio's on-device estimate is made WITHOUT it, so the figure printed here at runtime
; is the one to believe.
;
; The first build compiles the whole TensorFlow Lite Micro tree and takes several
; minutes. Later builds are incremental.
; ---------------------------------------------------------------------------------
[env:xiaodetect]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter =
	-<*>
	+<xiao_detect.cpp>

build_flags =
	-DCORE_DEBUG_LEVEL=3

lib_deps = EiRockModel

test_ignore = *
